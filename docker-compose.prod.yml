# =============================================================================
# THE HIDDEN LABEL — Production Docker Compose Orchestration
# =============================================================================

version: "3.8"

services:
  postgres:
    image: postgres:18-alpine
    container_name: thl-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thl_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be set}
      POSTGRES_DB: ${POSTGRES_DB:-the_hidden_label}
    volumes:
      - thl-prod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  redis:
    image: redis:7-alpine
    container_name: thl-redis-prod
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Redis password must be set}", "--appendonly", "yes"]
    volumes:
      - thl-prod-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: thl-backend-prod
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - apps/backend/.env.production
    environment:
      NODE_ENV: production
      PORT: 9000
    volumes:
      - thl-prod-uploads:/app/apps/backend/uploads
    networks:
      - internal-net
      - proxy-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: thl-admin-prod
    restart: always
    depends_on:
      - backend
    env_file:
      - apps/admin/.env.production
    environment:
      NODE_ENV: production
      PORT: 7001
    networks:
      - internal-net
      - proxy-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    container_name: thl-storefront-prod
    restart: always
    depends_on:
      - backend
    env_file:
      - apps/storefront/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - internal-net
      - proxy-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: thl-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/ssl:/etc/ssl/thehiddenlabel:ro
    depends_on:
      - backend
      - admin
      - storefront
    networks:
      - proxy-net

volumes:
  thl-prod-pgdata:
  thl-prod-redisdata:
  thl-prod-uploads:

networks:
  internal-net:
    internal: true
  proxy-net:
